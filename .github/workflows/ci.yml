name: CI

# Every pull request and every push to main or ci runs the tests a contributor runs locally, plus a secret scan of the
# tree: the companion (with the real Cordis from a staged DSH runtime), Tailcat, the NSH app, and the Android and iOS
# shells' unit tests (Gradle on the pinned NSH runtime, DSHKit `swift test`). Emulator and simulator checks run on a
# Mac before a release.
on:
  pull_request:
  push:
    branches: [main, ci]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Shared paint-only Text shimmer backport on 7b3031f; no unrelated runtime upgrade.
  NSH_COMMIT: 33512ba2268774f5a8904e1532aabe37b2f2a65f
  GITLEAKS_VERSION: "8.30.1"
  # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums file. Update both together.
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  history:
    name: Public history rules
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out every branch and tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      # Every commit comes from source-export: the public identity, 12:00:00 UTC, and Source-Rev as its only
      # trailer. The upstream DSH Mobile history before the fork keeps its authors.
      - name: Check commit and tag identity, dates and trailers
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 -I tools/check-public-history.py
          --author "Jingtao Wang <7776499+jt-wang@users.noreply.github.com>"
          --upstream 284014487+pavel-logachev@users.noreply.github.com --upstream ai@logachev.net
          --upstream github@logachev.net ${PR_HEAD}

  host:
    name: Companion / Linux / Node 24
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # The DSH whose Cordis the real-Cordis tests (dsh-adapter, phone-adapter, progress-plugin) load. Exact, so a new
      # DSH release cannot turn this job red; the DSH canary follows new releases.
      DSH_VERSION: 0.2.2-rc.5
    defaults:
      run:
        working-directory: host
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Upgrade tests load the shipped 0.7.0 sources (2168cf4) from Git history.
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            host/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci
      - name: Stage DSH's Cordis from npm (no install scripts)
        shell: bash
        run: |
          runtime="$RUNNER_TEMP/dsh-runtime"
          mkdir -p "$runtime" && cd "$runtime"
          echo '{"private":true}' > package.json
          npm install --registry=https://registry.npmjs.org/ --ignore-scripts --no-audit --no-fund --save-exact "@deepseek-ai/dsh@$DSH_VERSION"
          module="$runtime/node_modules/@deepseek-ai/cordis/lib/index.js"
          test -f "$module"
          echo "DSH_ANYWHERE_CORDIS_MODULE=$module" >> "$GITHUB_ENV"
      - name: Build and test (real Cordis included)
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/host-test.log"
          if grep -E 'Cordis.*# SKIP' "$RUNNER_TEMP/host-test.log"; then echo 'A real-Cordis test was skipped.'; exit 1; fi

  host-macos:
    name: Companion / macOS / live Tailcat pairing
    runs-on: macos-26-intel
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            host/package-lock.json
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: tailcat/go.mod
          cache: false
      - name: Go is tailcat/go.mod's toolchain
        shell: bash
        run: bash tailcat/check-go-version.sh
      - name: Build the macOS Tailcat helper
        shell: bash
        run: |
          HELPERS_ONLY=1 tools/build-tailcat.sh
          file host/dist/tailcat/dsh-tailcat-host-darwin-arm64
          codesign -v host/dist/tailcat/dsh-tailcat-host-darwin-arm64
      - name: Build and test the companion (real dns-sd Bonjour)
        working-directory: host
        run: |
          export PATH="$(brew --prefix openssl@3)/bin:$PATH"
          openssl version
          npm ci
          npm test
      - name: Pair a reference phone over real Tailcat relays
        shell: bash
        run: tools/tailcat-e2e.sh
      - name: Install, activate and uninstall in a throwaway DSH home
        shell: bash
        run: |
          sandbox="$(cd "$(mktemp -d)" && pwd -P)"  # macOS mktemp is under the /var symlink
          mkdir -p "$sandbox/home" "$sandbox/dsh/profiles/web"
          echo '{}' > "$sandbox/dsh/profiles/web/package.json"
          printf -- '- insert:\n    - id: existing-plugin\n      name: example\n' > "$sandbox/dsh/profiles/web/cordis.patch.yml"
          cp "$sandbox/dsh/profiles/web/cordis.patch.yml" "$sandbox/original.yml"
          export HOME="$sandbox/home"
          node tools/install-host.mjs --dsh-home "$sandbox/dsh" --dsh-version 0.2.2
          node tools/install-host.mjs --dsh-home "$sandbox/dsh" --dsh-version 0.2.2 --activate
          grep -q 'DSH-MOBILE-COMPANION-BEGIN' "$sandbox/dsh/profiles/web/cordis.patch.yml"
          node tools/install-host.mjs --dsh-home "$sandbox/dsh" --dsh-version 0.2.2 --uninstall
          cmp "$sandbox/original.yml" "$sandbox/dsh/profiles/web/cordis.patch.yml"
          echo "installer: install, activate and uninstall restored the original profile"

  tailcat:
    name: Tailcat / Go
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tailcat
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: tailcat/go.mod
          cache: false
      - name: Go is tailcat/go.mod's toolchain
        shell: bash
        run: bash check-go-version.sh
      - name: Format, vet and test
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test -count=1 ./...

  app:
    name: Phone app / NSH tests and check
    runs-on: macos-26-intel
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Restore the NSH build
        id: nsh-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/nsh-bin
          key: nsh-cli-${{ runner.os }}-${{ runner.arch }}-${{ env.NSH_COMMIT }}
      - name: Build NSH from source
        if: steps.nsh-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git init -q "$RUNNER_TEMP/nsh" && cd "$RUNNER_TEMP/nsh"
          git fetch -q --depth 1 https://github.com/jt-wang/nsh.git "$NSH_COMMIT"
          git checkout -q FETCH_HEAD
          cargo build --release -p nsh-cli
          mkdir -p "$RUNNER_TEMP/nsh-bin" && cp target/release/nsh "$RUNNER_TEMP/nsh-bin/"
      - name: Test and check the app
        working-directory: nsh-app
        shell: bash
        run: |
          "$RUNNER_TEMP/nsh-bin/nsh" --version
          "$RUNNER_TEMP/nsh-bin/nsh" test
          # Images in a scroll view must clip, or NSH counts their full pixel size in its content.
          node scripts/scroll-content.mjs "$RUNNER_TEMP/nsh-bin/nsh" 390 844 --image photo-3000x4000.png=120x120 src/sent.test.tsx
          "$RUNNER_TEMP/nsh-bin/nsh" check

  android:
    name: Android shell / Gradle unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            host/package-lock.json
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: tailcat/go.mod
          cache: false
      - name: Go is tailcat/go.mod's toolchain
        shell: bash
        run: bash tailcat/check-go-version.sh
      - name: Prepare Android SDK
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "NSH_SOURCE=$RUNNER_TEMP/nsh" >> "$GITHUB_ENV"
          echo "NSH_HOME=$RUNNER_TEMP/nsh-dist" >> "$GITHUB_ENV"
      # The same NSH runtime android-release.yml builds: the pinned commit with the app's number-pad patch.
      - name: Restore the NSH Android build
        id: nsh-android-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ${{ runner.temp }}/nsh/target/release/nsh
            ${{ runner.temp }}/nsh/target/android/release/classes.jar
            ${{ runner.temp }}/nsh/target/android/release/lib/arm64-v8a/libnsh.so
          key: nsh-android-${{ runner.os }}-${{ env.NSH_COMMIT }}-${{ hashFiles('nsh-app/nsh-number-pad.patch') }}
      - name: Build the pinned NSH runtime
        if: steps.nsh-android-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libclang-dev libssl-dev cmake
          rustup target add aarch64-linux-android
          git init -q "$NSH_SOURCE"
          git -C "$NSH_SOURCE" fetch -q --depth 1 https://github.com/jt-wang/nsh.git "$NSH_COMMIT"
          git -C "$NSH_SOURCE" checkout -q --detach FETCH_HEAD
          git -C "$NSH_SOURCE" apply "$GITHUB_WORKSPACE/nsh-app/nsh-number-pad.patch"
          cargo build --manifest-path "$NSH_SOURCE/Cargo.toml" --locked --release -p nsh-cli
          (cd "$NSH_SOURCE" && cargo xtask android --release --abi arm64-v8a)
      - name: Fetch NSH's Android AAR
        shell: bash
        run: |
          # build.sh replaces all Java classes and native libraries in this AAR with the pinned build above.
          curl -fsSL https://github.com/longbridge/nsh/releases/download/v0.3.0/nsh-embed-android.zip -o "$RUNNER_TEMP/nsh-android.zip"
          echo "adc5c71e547c9901462208b50630548b3ae618b53555c581937a1d5c4e05eda6  $RUNNER_TEMP/nsh-android.zip" | sha256sum -c -
          mkdir -p "$NSH_HOME/embed/android"
          unzip -j "$RUNNER_TEMP/nsh-android.zip" '*/nsh.aar' -d "$NSH_HOME/embed/android"
      - name: Build Tailcat and the app, then run the shell's unit tests
        shell: bash
        run: |
          npm ci --prefix host
          AAR_ONLY=1 tools/build-tailcat.sh
          nsh-app/android/build.sh
          mkdir -p nsh-app/android/app/src/test/resources
          node nsh-app/android/app/src/test/make-fixtures.ts nsh-app/android/app/src/test/resources
          (cd nsh-app/android && ./gradlew --no-daemon --console=plain testReleaseUnitTest)

  ios-shell:
    name: iOS shell / DSHKit swift test
    runs-on: macos-26-intel
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      # pairing.json gets fresh synthetic keys each time; extra.json's PKCS#12 identities are made from it.
      - name: Make the synthetic pairing fixtures
        shell: bash
        run: |
          export PATH="$(brew --prefix openssl@3)/bin:$PATH"
          npm ci --prefix host
          mkdir -p nsh-app/android/app/src/test/resources
          node nsh-app/android/app/src/test/make-fixtures.ts nsh-app/android/app/src/test/resources
          python3 -I nsh-app/ios/DSHKit/Tests/DSHKitTests/make-fixtures.py
      - name: Test
        working-directory: nsh-app/ios/DSHKit
        run: |
          swift --version
          swift test

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Scan the tree
        shell: bash
        run: |
          curl -sfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --redact --no-banner --exit-code 1
